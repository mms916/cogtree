  <path d="M478 360 C552 360 552 408 626 408" stroke="#6b7280" stroke-width="2" opacity="0.68"/>
  <path d="M478 360 C552 360 552 506 626 506" stroke="#6b7280" stroke-width="2" opacity="0.68"/>

  <path d="M778 214 C836 214 836 170 894 170" stroke="#5f6875" stroke-width="1.6" opacity="0.58"/>
  <path d="M778 214 C836 214 836 252 894 252" stroke="#5f6875" stroke-width="1.6" opacity="0.58"/>
  <path d="M778 312 C836 312 836 312 894 312" stroke="#5f6875" stroke-width="1.6" opacity="0.58"/>
  <path d="M778 408 C836 408 836 390 894 390" stroke="#5f6875" stroke-width="1.6" opacity="0.58"/>
  <path d="M778 408 C836 408 836 456 894 456" stroke="#5f6875" stroke-width="1.6" opacity="0.58"/>
  <path d="M778 506 C836 506 836 526 894 526" stroke="#5f6875" stroke-width="1.6" opacity="0.58"/>

  <g filter="url(#shadow)">
    <rect x="260" y="292" width="218" height="136" rx="16" fill="#131720" stroke="url(#rootStroke)" stroke-width="2"/>
