<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#242c38" opacity="0.72"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="rootStroke" x1="260" y1="310" x2="480" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <style>
      .label { font: 600 22px "Segoe UI", Arial, sans-serif; fill: #e2e8f0; }
      .small { font: 500 16px "Segoe UI", Arial, sans-serif; fill: #8b949e; }
      .accent { fill: #2dd4bf; }
      .child { font: 600 17px "Segoe UI", Arial, sans-serif; fill: #d8dee8; }
      .leaf { font: 500 15px "Segoe UI", Arial, sans-serif; fill: #b8c1cc; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="#0f131a"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <rect x="0" y="0" width="1280" height="56" fill="#0b0f15"/>
  <text x="32" y="35" class="small">画布样图 / 左父右子导图布局</text>

  <path d="M478 360 C552 360 552 214 626 214" stroke="#6b7280" stroke-width="2" opacity="0.68"/>
